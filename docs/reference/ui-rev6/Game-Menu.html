<style>
body{margin:0}
a{color:#1C58C7}a:hover{color:#0F2240}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.n{font-variant-numeric:tabular-nums}
.dot{font-family:Doto,monospace;font-weight:900;line-height:1}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pn{background:#FFFFFF;border-radius:16px;box-shadow:0 0 0 1.5px #D3E2F7,0 4px 0 #C2D5EF,0 14px 28px rgba(15,34,64,.16);box-sizing:border-box;position:relative}
.tbar{height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;color:#FFFFFF;font-size:10.5px;font-weight:600;border-radius:16px 16px 0 0;box-sizing:border-box;flex:none}
.xb{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex:none}
.btn{height:34px;padding:0 14px;border-radius:10px;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;text-decoration:none;white-space:nowrap}
.bb{background:#2F7BFF;color:#FFFFFF;box-shadow:0 3px 0 #1C58C7}
a.bb:hover{color:#FFFFFF;background:#3C86FF}
.bw{background:#FFFFFF;color:#0F2240;box-shadow:inset 0 0 0 1.5px #D3E2F7,0 3px 0 #D3E2F7}
a.bw:hover{color:#0F2240;background:#F5F9FF}
.br{background:#E5484D;color:#FFFFFF;box-shadow:0 3px 0 #B4232A}
.lbl{font-size:9px;color:#4B5E7E}
.cap{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4B5E7E}
.well{background:#F2F7FF;border-radius:12px;box-shadow:inset 0 0 0 1.5px #DCE8FA;box-sizing:border-box}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:#EAF2FF;box-sizing:border-box}
.sg{flex:1;min-width:0;height:26px;padding:0 6px;border-radius:8px;font-size:9.5px;font-weight:600;color:#4B5E7E;white-space:nowrap}
.sg[aria-pressed=true]{background:#2F7BFF;color:#FFFFFF;box-shadow:0 2px 0 #1C58C7}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:#C9D6E8;flex:none}
.sw span{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked=true]{background:#2F7BFF}
.sw[aria-checked=true] span{left:18px}
.new{background:#EDE9FE;color:#5B21B6;font-size:9px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 6px;white-space:nowrap;flex:none}
.tbd{background:#EEF2F7;color:#4B5E7E;font-size:9px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 6px;white-space:nowrap;flex:none}
.led{background-color:#0F2240;background-image:radial-gradient(circle,#1B3766 1.3px,transparent 1.6px);background-size:7px 7px;border-radius:14px;box-shadow:inset 0 0 0 2px #1B3766,0 4px 0 #091733;box-sizing:border-box}
.perf{height:12px;background-image:radial-gradient(circle,#DCE8FA 2.5px,transparent 3px);background-size:12px 12px;background-position:center}
.bar{background:repeating-linear-gradient(90deg,#0F2240 0 2px,transparent 2px 4px,#0F2240 4px 7px,transparent 7px 9px,#0F2240 9px 10px,transparent 10px 13px,#0F2240 13px 16px,transparent 16px 18px)}
.screw{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFFFFF 0,#B7C6DB 70%);box-shadow:0 0 0 1px rgba(15,34,64,.15)}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

</style>
