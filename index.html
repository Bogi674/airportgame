<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Airfield Tycoon</title>
    <style>
      html, body, #app { margin: 0; height: 100%; background: #10161c; overflow: hidden; color: #dfe7ec; }
      button { font: inherit; color: #e6eef3; background: #223340; border: 1px solid #36505f; border-radius: 5px; padding: 3px 9px; cursor: pointer; }
      button:hover:not(:disabled) { background: #2c4252; }
      button:disabled { opacity: 0.45; cursor: default; }
      button[aria-pressed='true'] { background: #2d6cdf; border-color: #4b86ee; color: #fff; }
      input, select { font: inherit; color: #e6eef3; background: #16222b; border: 1px solid #36505f; border-radius: 4px; padding: 2px 5px; }
      input[type='checkbox'], input[type='range'] { padding: 0; }
      table th { font-weight: 600; color: #9fb4c4; padding: 2px 6px; }
      table td { padding: 2px 6px; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #7fb0ff; outline-offset: 1px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
